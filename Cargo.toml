[package]
name = "attio"
version = "0.1.0"
edition = "2021"
description = "CLI for interacting with Attio CRM API"
license = "MIT"
repository = "https://github.com/attio/attio-cli"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Config
dirs = "6"
toml = "0.8"

# Output
tabled = "0.17"

# Misc
atty = "0.2"
